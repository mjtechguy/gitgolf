 rpc SubmitStandardPullMerge(SubmitStandardPullMergeRequest) returns (SubmitStandardPullMergeResponse);
 rpc GetStandardPullMergeOperation(GetStandardPullMergeOperationRequest) returns (GetStandardPullMergeOperationResponse);
}
enum StandardPullMergePhase {
 STANDARD_PULL_MERGE_PHASE_UNSPECIFIED = 0;
 STANDARD_PULL_MERGE_PHASE_RESERVED = 1;
