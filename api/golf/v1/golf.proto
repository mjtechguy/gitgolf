 string repository_id = 1;
 repeated RepositoryWikiPageMetadata pages = 2;
 PageResponse page = 3;
 // Native total includes non-page Git entries; not a total wiki-page count.
 string native_entry_count = 4;
}
message GetRepositoryWikiPageRequest { RepositoryKey repository = 1; string repository_id = 2; string slug = 3; }
message GetRepositoryWikiPageResponse {
 string repository_id = 1;
 RepositoryWikiPageMetadata page = 2;
 optional string markdown = 3;
 string content_unavailable_reason = 4;
 string commit_count = 5;
}

