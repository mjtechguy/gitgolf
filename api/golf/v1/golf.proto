 string updated_at = 18;
 string method = 19;
 string contract = 20;
 RepositoryKey source_repository = 21;
 string source_repository_id = 22;
 string source_owner_id = 23;
}
message SubmitStandardPullMergeResponse { StandardPullMergeOperation operation = 1; }
message GetStandardPullMergeOperationResponse { StandardPullMergeOperation operation = 1; }

