 ActionRunKind kind_filter = 5;
 string workflow_path = 6;
}
message ListActionRunsResponse { string repository_id = 1; repeated ActionRunSummary runs = 2; string next_cursor = 3; }
message GetActionRunRequest { RepositoryKey repository = 1; string repository_id = 2; ActionRunRef ref = 3; }
message GetActionRunResponse {
 string repository_id = 1;
 ActionRunSummary summary = 2;
 oneof detail {
  WorkflowRun workflow = 3;
  AgentTask task = 4;
  ReviewerRun review = 5;
 }
}

// Private single-attempt Codex observations. Text/native IDs are withheld until
// original and refreshed credential screening completes under current authority.
enum AgentEventBodyState {
 AGENT_EVENT_BODY_STATE_UNSPECIFIED = 0;
 AGENT_EVENT_BODY_STATE_WITHHELD = 1;
 AGENT_EVENT_BODY_STATE_AVAILABLE = 2;
 AGENT_EVENT_BODY_STATE_UNAVAILABLE = 3;
}
message AgentEventPlanStep { string step = 1; string status = 2; }
message AgentTaskEvent {
 string sequence = 1;
 string kind = 2;
 string created_at = 3;
 string status = 4;
 string tool_kind = 5;
 optional string total_tokens = 6;
 AgentEventBodyState body_state = 7;
 string text = 8;
 string thread_id = 9;
 string turn_id = 10;
 string item_id = 11;
 string phase = 12;
 repeated AgentEventPlanStep plan = 13;
}
message ListAgentTaskEventsRequest {
 RepositoryKey repository = 1;
 string repository_id = 2;
 string task_id = 3;
 string attempt_id = 4;
 string after_sequence = 5;
 uint32 limit = 6;
}
message ListAgentTaskEventsResponse {
 string repository_id = 1;
 string task_id = 2;
 string attempt_id = 3;
 string commit_id = 4;
 string native_initiator_id = 5;
 AgentEventBodyState body_state = 6;
 repeated AgentTaskEvent events = 7;
 string next_sequence = 8;
}

// Repository-scoped native SSH deploy-key associations. Managed browser sessions
// only; personal repository administration is checked before and after reads.
service RepositoryDeployKeyService {
  rpc ListRepositoryDeployKeys(ListRepositoryDeployKeysRequest) returns (ListRepositoryDeployKeysResponse);
  rpc AddRepositoryDeployKey(AddRepositoryDeployKeyRequest) returns (AddRepositoryDeployKeyResponse);
  rpc DeleteRepositoryDeployKey(DeleteRepositoryDeployKeyRequest) returns (DeleteRepositoryDeployKeyResponse);
}
message RepositoryDeployKey {
  string id = 1;
  string public_key_id = 2;
  string title = 3;
  string public_key = 4;
  string fingerprint = 5;
  string created_at = 6;
  bool read_only = 7;
  string revision = 8;
}
message ListRepositoryDeployKeysRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string expected_revision = 4;
  PageRequest page = 5;
}
message ListRepositoryDeployKeysResponse {
  repeated RepositoryDeployKey keys = 1;
  PageResponse page = 2;
  string repository_id = 3;
  string owner_id = 4;
  string access_revision = 5;
}
message AddRepositoryDeployKeyRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string expected_revision = 4;
  string title = 5;
  string public_key = 6;
  // Presence required. This applies to this repository association only.
  optional bool read_only = 7;
}
message AddRepositoryDeployKeyResponse {
  RepositoryDeployKey key = 1;
  string repository_id = 2;
  string owner_id = 3;
  string access_revision = 4;
}
message DeleteRepositoryDeployKeyRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string expected_revision = 4;
  // Association ID, never the shared public-key ID.
  string key_id = 5;
  string expected_key_revision = 6;
}
message DeleteRepositoryDeployKeyResponse {
  string key_id = 1;
  string repository_id = 2;
  string owner_id = 3;
  string access_revision = 4;
}

// Exact immutable job/matrix coordinates; engine outcomes never invent exits.
message WorkflowMatrixEntry { string name = 1; string value_json = 2; }
message WorkflowJobInstance {
 string instance_id = 1;
 string job_id = 2;
 string name = 3;
 repeated WorkflowMatrixEntry matrix = 4;
 repeated string needs = 5;
 WorkflowStepState state = 6;
 optional string started_at = 7;
 optional string finished_at = 8;
 repeated WorkflowEngineStep steps = 9;
 bool events_recorded = 10;
 string image_digest = 11;
}
message WorkflowEngineStep {
 string id = 1;
 string name = 2;
 WorkflowStepState state = 3;
 optional string started_at = 4;
 optional string finished_at = 5;
}
// Managed repository administration only. No receiver URL, native credential,
// signing secret or receiver response body is returned by this service.
service RepositoryWebhookService {
  rpc ListRepositoryWebhooks(ListRepositoryWebhooksRequest) returns (ListRepositoryWebhooksResponse);
  rpc SaveRepositoryWebhook(SaveRepositoryWebhookRequest) returns (SaveRepositoryWebhookResponse);
  rpc ListRepositoryWebhookDeliveries(ListRepositoryWebhookDeliveriesRequest) returns (ListRepositoryWebhookDeliveriesResponse);
  rpc TestRepositoryWebhook(TestRepositoryWebhookRequest) returns (TestRepositoryWebhookResponse);
  rpc RedeliverRepositoryWebhook(RedeliverRepositoryWebhookRequest) returns (RedeliverRepositoryWebhookResponse);
}
message RepositoryWebhookTarget {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
}
message RepositoryWebhookSubscription {
  string id = 1;
  string version = 2;
  string name = 3;
  string destination_host = 4;
  repeated string event_topics = 5;
  bool enabled = 6;
  string authorization_state = 7;
  bool has_signing_secret = 8;
  string created_at = 9;
  string updated_at = 10;
  string sponsor_user_id = 11;
}
message RepositoryWebhookDelivery {
  string id = 1;
  string subscription_id = 2;
  string subscription_version = 3;
  string event_id = 4;
  string event_topic = 5;
  string state = 6;
  uint32 attempts = 7;
  uint32 response_status = 8;
  string failure_code = 9;
  string next_attempt_at = 10;
  string created_at = 11;
  string completed_at = 12;
  bool possible_duplicate = 13;
}
message ListRepositoryWebhooksRequest { RepositoryWebhookTarget target = 1; PageRequest page = 2; }
message ListRepositoryWebhooksResponse {
  RepositoryWebhookTarget target = 1;
  repeated RepositoryWebhookSubscription subscriptions = 2;
  PageResponse page = 3;
  bool background_authorization_supported = 4;
}
message SaveRepositoryWebhookRequest {
  RepositoryWebhookTarget target = 1;
  string id = 2;
  string expected_version = 3;
  string name = 4;
  repeated string event_topics = 5;
  // Empty preserves the saved private value on an existing subscription.
  string endpoint = 6;
  string signing_secret = 7;
  bool enabled = 8;
  bool authorize_background = 9;
}
message SaveRepositoryWebhookResponse { RepositoryWebhookTarget target = 1; RepositoryWebhookSubscription subscription = 2; }
message ListRepositoryWebhookDeliveriesRequest { RepositoryWebhookTarget target = 1; string subscription_id = 2; PageRequest page = 3; }
message ListRepositoryWebhookDeliveriesResponse { RepositoryWebhookTarget target = 1; repeated RepositoryWebhookDelivery deliveries = 2; PageResponse page = 3; }
message TestRepositoryWebhookRequest { RepositoryWebhookTarget target = 1; string subscription_id = 2; string expected_version = 3; string operation_id = 4; }
message RedeliverRepositoryWebhookRequest { RepositoryWebhookTarget target = 1; string delivery_id = 2; string expected_version = 3; string operation_id = 4; }
message TestRepositoryWebhookResponse { RepositoryWebhookTarget target = 1; RepositoryWebhookDelivery delivery = 2; }
message RedeliverRepositoryWebhookResponse { RepositoryWebhookTarget target = 1; RepositoryWebhookDelivery delivery = 2; }

// Repository association only; global team permissions are read-only observations.
service RepositoryTeamAccessService {
  rpc ListRepositoryTeamAccess(ListRepositoryTeamAccessRequest) returns (ListRepositoryTeamAccessResponse);
  rpc AttachRepositoryTeam(AttachRepositoryTeamRequest) returns (AttachRepositoryTeamResponse);
  rpc DetachRepositoryTeam(DetachRepositoryTeamRequest) returns (DetachRepositoryTeamResponse);
}
message RepositoryTeamAccess {
  OrganizationTeam team = 1;
  bool attached = 2;
  bool is_owner_team = 3;
  bool can_attach = 4;
  bool can_detach = 5;
  string revision = 6;
}
message ListRepositoryTeamAccessRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string expected_revision = 4;
  PageRequest page = 5;
}
message ListRepositoryTeamAccessResponse {
  string repository_id = 1;
  string owner_id = 2;
  string access_revision = 3;
  bool can_manage = 4;
  repeated RepositoryTeamAccess teams = 5;
  PageResponse page = 6;
}
message AttachRepositoryTeamRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string expected_revision = 4;
  string team_id = 5;
  string expected_team_revision = 6;
}
message AttachRepositoryTeamResponse {
  string repository_id = 1;
  string owner_id = 2;
  string access_revision = 3;
  RepositoryTeamAccess team = 4;
}
message DetachRepositoryTeamRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string expected_revision = 4;
  string team_id = 5;
  string expected_team_revision = 6;
}
