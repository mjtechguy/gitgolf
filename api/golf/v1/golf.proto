// Golf execution results are distinct from native required-check eligibility.
service WorkflowRunService {
  // Pure exact-source parameter preparation; no dispatch or execution authority.
  rpc PrepareWorkflowDispatch(PrepareWorkflowDispatchRequest) returns (PrepareWorkflowDispatchResponse);
  rpc DispatchWorkflow(DispatchWorkflowRequest) returns (DispatchWorkflowResponse);
  rpc GetWorkflowRun(GetWorkflowRunRequest) returns (GetWorkflowRunResponse);
  rpc GetWorkflowDispatch(GetWorkflowDispatchRequest) returns (GetWorkflowDispatchResponse);
  rpc ListWorkflowRuns(ListWorkflowRunsRequest) returns (ListWorkflowRunsResponse);
  rpc CancelWorkflowRun(CancelWorkflowRunRequest) returns (CancelWorkflowRunResponse);
  rpc GetWorkflowRunLogs(GetWorkflowRunLogsRequest) returns (GetWorkflowRunLogsResponse);
