// Native comments do not expose reply IDs, ranges or authoritative outdatedness.
message PullRequestReviewComment {
  string id = 1;
  User user = 2;
  User resolver = 3;
  string body = 4;
  string path = 5;
  // Exactly one native side is present; these are file lines, not patch offsets.
  uint32 old_line = 6;
  uint32 new_line = 7;
  string review_id = 8;
