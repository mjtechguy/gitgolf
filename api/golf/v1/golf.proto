message BeginOwnMFAResponse { OwnMFA mfa = 1; string secret = 2; string provisioning_uri = 3; }
message ChangeOwnMFARequest { string expected_version = 1; string password_confirmation = 2; string code = 3; }
message ChangeOwnMFAResponse { OwnMFA mfa = 1; repeated string recovery_codes = 2; bool requires_login = 3; uint64 sessions_revoked = 4; string operation_id = 5; }
