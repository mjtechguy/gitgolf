message GetDiscussionResourceOperationRequest { string operation_id = 1; }
message GetDiscussionResourceOperationResponse { DiscussionResourceOperation operation = 1; }

service RepositoryFileMutationService {
  rpc GetRepositoryFileMutationAccess(GetRepositoryFileMutationAccessRequest) returns (GetRepositoryFileMutationAccessResponse);
  rpc SubmitRepositoryFileMutation(SubmitRepositoryFileMutationRequest) returns (SubmitRepositoryFileMutationResponse);
  rpc GetRepositoryFileMutationOperation(GetRepositoryFileMutationOperationRequest) returns (GetRepositoryFileMutationOperationResponse);
}
enum RepositoryFileMutationKind {
  REPOSITORY_FILE_MUTATION_KIND_UNSPECIFIED = 0;
  REPOSITORY_FILE_MUTATION_KIND_CREATE = 1;
  REPOSITORY_FILE_MUTATION_KIND_UPDATE = 2;
  REPOSITORY_FILE_MUTATION_KIND_DELETE = 3;
}
enum RepositoryFileMutationPhase {
  REPOSITORY_FILE_MUTATION_PHASE_UNSPECIFIED = 0;
  REPOSITORY_FILE_MUTATION_PHASE_RESERVED = 1;
  REPOSITORY_FILE_MUTATION_PHASE_DISPATCH_UNKNOWN = 2;
  REPOSITORY_FILE_MUTATION_PHASE_SUCCEEDED = 3;
  REPOSITORY_FILE_MUTATION_PHASE_REJECTED = 4;
}
// Ordinary unprotected branch contents only. The native API accepts a blob SHA
// for updates/deletes; expected_commit_id is an observed HEAD, not atomic CAS.
message SubmitRepositoryFileMutationRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string access_revision = 4;
  string operation_id = 5;
  RepositoryFileMutationKind kind = 6;
  string branch = 7;
  string expected_commit_id = 8;
  string path = 9;
  string expected_blob_id = 10;
  bytes content = 11; // At most 256 KiB; empty for deletion.
  string commit_message = 12;
}
message GetRepositoryFileMutationOperationRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string operation_id = 4;
}
message RepositoryFileMutationOperation {
  string contract = 1;
  string operation_id = 2;
  string actor_id = 3;
  RepositoryKey repository = 4;
  string repository_id = 5;
  string owner_id = 6;
  string access_revision = 7;
  RepositoryFileMutationKind kind = 8;
  string branch = 9;
  string expected_commit_id = 10;
  string path = 11;
  string expected_blob_id = 12;
  string content_sha256 = 13;
  uint64 content_size_bytes = 14;
  string commit_message_sha256 = 15;
  RepositoryFileMutationPhase phase = 16;
  string commit_id = 17;
  string blob_id = 18;
  string created_at = 19;
  string updated_at = 20;
  string failure_code = 21;
}
message SubmitRepositoryFileMutationResponse { RepositoryFileMutationOperation operation = 1; }
message GetRepositoryFileMutationOperationResponse { RepositoryFileMutationOperation operation = 1; }

// Native discussion engagement; session-only mutations use the retained resource journal.
service DiscussionCollaborationService {
  rpc GetDiscussionEngagement(GetDiscussionEngagementRequest) returns (GetDiscussionEngagementResponse);
  rpc ListDiscussionTimeline(ListDiscussionTimelineRequest) returns (ListDiscussionTimelineResponse);
  rpc ListOwnForgeNotifications(ListOwnForgeNotificationsRequest) returns (ListOwnForgeNotificationsResponse);
  rpc ListIssueTemplates(ListIssueTemplatesRequest) returns (ListIssueTemplatesResponse);
}
message DiscussionTarget {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string issue_id = 3;
  uint32 number = 4;
  bool pull_request = 5;
  // Empty targets the issue description; otherwise an ordinary comment in this discussion.
  string comment_id = 6;
}
message DiscussionReaction {
  string content = 1;
  uint32 count = 2;
  bool reacted = 3;
}
message GetDiscussionEngagementRequest { DiscussionTarget target = 1; }
message GetDiscussionEngagementResponse {
  repeated DiscussionReaction reactions = 1;
  bool subscribed = 2;
  // Complete current reaction inventory and subscription, bound to actor/immutable target IDs.
  // This observation is not atomic with a later native change.
  string revision = 3;
  bool can_react = 4;
  bool can_subscribe = 5;
  string actor_login = 6;
}
message ListDiscussionTimelineRequest { DiscussionTarget target = 1; PageRequest page = 2; }
message DiscussionTimelineEvent {
  string id = 1;
  string kind = 2;
  User actor = 3;
  string created_at = 4;
  string body = 5;
  string old_title = 6;
  string new_title = 7;
  DiscussionLabel label = 8;
  // Only independently authorized same-repository references are returned.
  uint32 referenced_number = 9;
  bool referenced_pull_request = 10;
  string referenced_title = 11;
}
message ListDiscussionTimelineResponse { repeated DiscussionTimelineEvent events = 1; PageResponse page = 2; }

