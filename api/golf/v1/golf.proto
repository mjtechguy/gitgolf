  rpc DeleteRepositoryEnvironment(DeleteRepositoryEnvironmentRequest) returns (DeleteRepositoryEnvironmentResponse);
  rpc GetRepositoryEnvironmentOperation(GetRepositoryEnvironmentOperationRequest) returns (GetRepositoryEnvironmentOperationResponse);
}
message RepositoryEnvironmentTarget {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string access_revision = 4;
}
message RepositoryEnvironmentReviewer {
  string id = 1;
  string login = 2;
}
message RepositoryEnvironmentPolicy {
  bool allow_all_sources = 1;
  // Exact literals only: BRANCH, TAG or full COMMIT. No glob or default-branch guess.
  repeated RepositorySourceSelector sources = 2;
  repeated RepositoryEnvironmentReviewer reviewers = 3;
  uint32 required_approvals = 4;
  bool prevent_self_approval = 5;
  // True remains unsupported until a deployment consumer qualifies bypass.
  bool allow_admin_bypass = 6;
  uint32 wait_seconds = 7;
  uint32 max_concurrency = 8;
  bool protected_previews = 9;
  uint32 preview_ttl_seconds = 10;
}
enum RepositoryEnvironmentCapability {
  REPOSITORY_ENVIRONMENT_CAPABILITY_UNSPECIFIED = 0;
  REPOSITORY_ENVIRONMENT_CAPABILITY_CONFIGURATION_ONLY = 1;
}
message RepositoryEnvironment {
  string id = 1;
  RepositoryEnvironmentTarget target = 2;
  string name = 3;
  string version = 4;
  RepositoryEnvironmentPolicy policy = 5;
  string creator_id = 6;
  string updater_id = 7;
  string created_at = 8;
  string updated_at = 9;
  bool deleted = 10;
  RepositoryEnvironmentCapability capability = 11;
  bool deployment_available = 12;
}
enum RepositoryEnvironmentAction {
  REPOSITORY_ENVIRONMENT_ACTION_UNSPECIFIED = 0;
  REPOSITORY_ENVIRONMENT_ACTION_SAVE = 1;
  REPOSITORY_ENVIRONMENT_ACTION_DELETE = 2;
}
message RepositoryEnvironmentOperation {
  string operation_id = 1;
  string environment_id = 2;
  RepositoryEnvironmentTarget target = 3;
  string actor_id = 4;
  RepositoryEnvironmentAction action = 5;
  string expected_version = 6;
  string version = 7;
  // SUCCEEDED means only the atomic local configuration transaction committed.
  string state = 8;
  string created_at = 9;
}
message ListRepositoryEnvironmentsRequest {
  RepositoryEnvironmentTarget target = 1;
  PageRequest page = 2;
}
message ListRepositoryEnvironmentsResponse {
  RepositoryEnvironmentTarget target = 1;
  repeated RepositoryEnvironment environments = 2;
  PageResponse page = 3;
  string total_count = 4;
  RepositoryEnvironmentCapability capability = 5;
  bool deployment_available = 6;
}
message SaveRepositoryEnvironmentRequest {
  RepositoryEnvironmentTarget target = 1;
  string environment_id = 2;
  // Canonical decimal: 0 creates a never-used UUID; positive edits that version.
  string expected_version = 3;
  string name = 4;
  RepositoryEnvironmentPolicy policy = 5;
  string operation_id = 6;
  string current_password = 7;
}
message SaveRepositoryEnvironmentResponse {
  RepositoryEnvironment environment = 1;
  RepositoryEnvironmentOperation operation = 2;
}
message DeleteRepositoryEnvironmentRequest {
  RepositoryEnvironmentTarget target = 1;
  string environment_id = 2;
  string expected_version = 3;
  string operation_id = 4;
  string current_password = 5;
}
message DeleteRepositoryEnvironmentResponse {
  RepositoryEnvironment environment = 1;
  RepositoryEnvironmentOperation operation = 2;
}
message GetRepositoryEnvironmentOperationRequest {
  RepositoryEnvironmentTarget target = 1;
  string operation_id = 2;
}
message GetRepositoryEnvironmentOperationResponse {
  RepositoryEnvironmentOperation operation = 1;
  // Historical accepted version, not current configuration or deployment readiness.
  RepositoryEnvironment environment = 2;
}

// Controls actions-topic delivery without changing repository activity or SSE.
enum WorkflowNotificationMode {
 WORKFLOW_NOTIFICATION_MODE_UNSPECIFIED = 0;
 WORKFLOW_NOTIFICATION_MODE_ACTIVITY = 1;
 WORKFLOW_NOTIFICATION_MODE_COMPLETED = 2;
 WORKFLOW_NOTIFICATION_MODE_FAILURES = 3;
}

// Inspect one original managed manual dispatch whose original ref was a full SHA.
// Named-ref dispatches are not adopted using their resolved commit. Absence is
// not no-effect proof.
message GetWorkflowDispatchRequest {
 RepositoryKey repository = 1;
 string repository_id = 2;
 string owner_id = 3;
 string commit_id = 4;
 string workflow_path = 5;
 string idempotency_key = 6;
 optional string submitted_sha256 = 7;
 optional string schema_sha256 = 8;
 optional string workflow_blob_id = 9;
 optional string input_contract = 10;
 optional string effective_sha256 = 11;
}
message GetWorkflowDispatchResponse {
 RepositoryKey repository = 1;
 string repository_id = 2;
 string owner_id = 3;
 string native_actor_id = 4;
 string idempotency_key = 5;
 WorkflowRun run = 6;
 string submitted_sha256 = 7;
 string effective_sha256 = 8;
 string schema_sha256 = 9;
 string input_contract = 10;
}

// Presence in the value oneof distinguishes false/zero/empty from omission.
// Number values are JSON decimal text; the server returns canonical-map digests.
// Choice uses string_value and must match a declared option.
enum WorkflowDispatchInputType {
 WORKFLOW_DISPATCH_INPUT_TYPE_UNSPECIFIED = 0;
 WORKFLOW_DISPATCH_INPUT_TYPE_STRING = 1;
 WORKFLOW_DISPATCH_INPUT_TYPE_BOOLEAN = 2;
 WORKFLOW_DISPATCH_INPUT_TYPE_NUMBER = 3;
 WORKFLOW_DISPATCH_INPUT_TYPE_CHOICE = 4;
}
message WorkflowDispatchInputValue {
 string name = 1;
 oneof value {
  string string_value = 2;
  bool boolean_value = 3;
  string number_value = 4;
 }
}
message WorkflowDispatchInputDefinition {
 string name = 1;
 WorkflowDispatchInputType type = 2;
 string description = 3;
 bool required = 4;
 optional WorkflowDispatchInputValue default_value = 5;
 repeated string options = 6;
}
message PrepareWorkflowDispatchRequest {
 RepositoryKey repository = 1;
 string repository_id = 2;
 string owner_id = 3;
 string commit_id = 4;
 string workflow_path = 5;
 repeated WorkflowDispatchInputValue inputs = 6;
}
message PrepareWorkflowDispatchResponse {
 RepositoryKey repository = 1;
 string repository_id = 2;
 string owner_id = 3;
 string native_actor_id = 4;
 string commit_id = 5;
 string workflow_path = 6;
 string workflow_blob_id = 7;
 string schema_sha256 = 8;
 string submitted_sha256 = 9;
 string effective_sha256 = 10;
 repeated WorkflowDispatchInputDefinition definitions = 11;
 // A parameter contract only. No worker/catalog availability or run admission.
 string input_contract = 12;
}

// Current native observations only. This service never issues a merge permit.
