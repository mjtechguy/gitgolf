 string owner_id = 5;
 string pull_request_id = 6;
 uint32 number = 7;
 string expected_pull_revision = 8;
 string head_commit_id = 9;
 // Original displayed B: context only; not an enforced native expected base.
 string observed_base_commit_id = 10;
 string source_ref = 11;
 string target_ref = 12;
 StandardPullMergePhase phase = 13;
 string merge_commit_id = 14;
