syntax = "proto3";

package golf.v1;

option go_package = "github.com/mjtechguy/golf-git/gen/golf/v1;golfv1";

// Shared API for human and machine clients. Cookie authentication uses the same
// effective upstream permissions for every operation. Bootstrap token login is
// explicitly named; local passwords are Golf-owned and mapped to existing forge identities.
service SessionService {
  rpc GetAuthenticationOptions(GetAuthenticationOptionsRequest) returns (GetAuthenticationOptionsResponse);
  rpc BeginGiteaOAuth(BeginGiteaOAuthRequest) returns (BeginGiteaOAuthResponse);
  rpc LoginWithPassword(LoginWithPasswordRequest) returns (LoginWithPasswordResponse);
  rpc LoginWithGiteaToken(LoginWithGiteaTokenRequest) returns (LoginWithGiteaTokenResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (RevokeOtherSessionsResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

// Owner-managed, read-only delegation of an existing browser session.
// Cookie authentication is required for lifecycle operations. Bearer credentials
// cannot issue, list or revoke credentials, or invoke mutating procedures.
service ApiCredentialService {
  rpc CreateApiCredential(CreateApiCredentialRequest) returns (CreateApiCredentialResponse);
  rpc ListApiCredentials(ListApiCredentialsRequest) returns (ListApiCredentialsResponse);
  rpc RevokeApiCredential(RevokeApiCredentialRequest) returns (RevokeApiCredentialResponse);
}

message ApiCredential {
  // Opaque decimal Golf handle. Never a secret or digest.
  string id = 1;
  string label = 2;
  string created_at = 3;
  string expires_at = 4;
  string revoked_at = 5;
  string source_session_id = 6;
  bool source_session_active = 7;
}
message CreateApiCredentialRequest {
  // Exact nonempty trimmed UTF-8, at most 64 bytes; no control characters.
  string label = 1;
  // Zero defaults to 3600; otherwise 60..43200. Actual expiry is capped by
  // the authenticated source session's absolute expiry.
  uint32 lifetime_seconds = 2;
}
message CreateApiCredentialResponse {
  ApiCredential credential = 1;
  // Returned once. Never returned by metadata reads or persisted in plaintext.
  string token = 2;
}
message ListApiCredentialsRequest { PageRequest page = 1; }
message ListApiCredentialsResponse {
  repeated ApiCredential credentials = 1;
  PageResponse page = 2;
  string current_source_expires_at = 3;
}
message RevokeApiCredentialRequest { string credential_id = 1; }
message RevokeApiCredentialResponse { ApiCredential credential = 1; }

// Own-account native SSH authentication keys. Browser sessions only; these are
// persistent account keys, not session-bound or repository-scoped delegations.
service GitAccessService {
  rpc ListSSHKeys(ListSSHKeysRequest) returns (ListSSHKeysResponse);
  rpc AddSSHKey(AddSSHKeyRequest) returns (AddSSHKeyResponse);
  rpc DeleteSSHKey(DeleteSSHKeyRequest) returns (DeleteSSHKeyResponse);
}
message SSHKey {
  string id = 1;
  string title = 2;
  string public_key = 3;
  string fingerprint = 4;
  string created_at = 5;
  string last_used_at = 6;
}
message ListSSHKeysRequest { PageRequest page = 1; }
message ListSSHKeysResponse {
  repeated SSHKey keys = 1;
  PageResponse page = 2;
}
message AddSSHKeyRequest {
  // Trimmed UTF-8 label, 1..64 bytes, without controls.
  string title = 1;
  // One OpenSSH public authentication key, at most 8192 bytes. No options,
  // certificates, private keys or multiple keys. Comments are discarded.
  string public_key = 2;
}
message AddSSHKeyResponse { SSHKey key = 1; }
message DeleteSSHKeyRequest { string key_id = 1; }
message DeleteSSHKeyResponse {}

// General repository metadata only; not protected policy or CI enablement.
service RepositorySettingsService {
  rpc GetRepositorySettings(GetRepositorySettingsRequest) returns (GetRepositorySettingsResponse);
  rpc UpdateRepositorySettings(UpdateRepositorySettingsRequest) returns (UpdateRepositorySettingsResponse);
}
message RepositorySettings {
  string repository_id = 1;
  string owner_id = 2;
  string description = 3;
  string default_branch = 4;
  bool has_issues = 5;
  bool has_wiki = 6;
  bool has_pull_requests = 7;
  bool can_edit = 8;
  // Observation fingerprint; native PATCH does not supply atomic CAS.
  string revision = 9;
}
message GetRepositorySettingsRequest { RepositoryKey repository = 1; }
message GetRepositorySettingsResponse { RepositorySettings settings = 1; }
message UpdateRepositorySettingsRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string expected_revision = 4;
  optional string description = 5;
  optional string default_branch = 6;
  optional bool has_issues = 7;
  optional bool has_wiki = 8;
  optional bool has_pull_requests = 9;
}
message UpdateRepositorySettingsResponse { RepositorySettings settings = 1; }

service RepositoryService {
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc CreateRepository(CreateRepositoryRequest) returns (CreateRepositoryResponse);
  rpc GetRepositoryCreation(GetRepositoryCreationRequest) returns (GetRepositoryCreationResponse);
  rpc GetRepository(GetRepositoryRequest) returns (GetRepositoryResponse);
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  rpc ListCommits(ListCommitsRequest) returns (ListCommitsResponse);
  rpc GetCommitDiff(GetCommitDiffRequest) returns (GetCommitDiffResponse);
  rpc GetContents(GetContentsRequest) returns (GetContentsResponse);
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse);
  rpc GetIssue(GetIssueRequest) returns (GetIssueResponse);
  rpc ListIssueComments(ListIssueCommentsRequest) returns (ListIssueCommentsResponse);
  rpc CreateIssue(CreateIssueRequest) returns (CreateIssueResponse);
  rpc CreateIssueComment(CreateIssueCommentRequest) returns (CreateIssueCommentResponse);
  rpc GetIssueMutation(GetIssueMutationRequest) returns (GetIssueMutationResponse);
  rpc ListPullRequests(ListPullRequestsRequest) returns (ListPullRequestsResponse);
  rpc GetPullRequest(GetPullRequestRequest) returns (GetPullRequestResponse);
  rpc ListPullRequestReviews(ListPullRequestReviewsRequest) returns (ListPullRequestReviewsResponse);
}

// Native forge membership browsing. These reads do not define Golf roles.
service OrganizationService {
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse);
  rpc ListTeamMembers(ListTeamMembersRequest) returns (ListTeamMembersResponse);
  rpc ListTeamRepositories(ListTeamRepositoriesRequest) returns (ListTeamRepositoriesResponse);
}

// Native organization-owner administration of ordinary team membership.
// Owners-team membership and Golf instance-role changes are excluded.
service OrganizationAdminService {
  rpc GetTeamAdministration(GetTeamAdministrationRequest) returns (GetTeamAdministrationResponse);
  rpc ResolveTeamMember(ResolveTeamMemberRequest) returns (ResolveTeamMemberResponse);
  rpc AddTeamMember(AddTeamMemberRequest) returns (AddTeamMemberResponse);
  rpc RemoveTeamMember(RemoveTeamMemberRequest) returns (RemoveTeamMemberResponse);
}

// Explicitly enrolled Golf administrator reads. Native site administration is
// not an instance-role grant. Credential material is never returned.
service InstanceAdminService {
  rpc DisableLocalAccount(DisableLocalAccountRequest) returns (DisableLocalAccountResponse);
  rpc ListLocalAccounts(ListLocalAccountsRequest) returns (ListLocalAccountsResponse);
}

// Own-account successful session lifecycle. This is not a complete security audit.
service AuditService {
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

service CapabilityService {
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
}

message User {
  // Decimal upstream identifier, treated as opaque by clients.
  string id = 1;
  string login = 2;
  string full_name = 3;
  string avatar_url = 4;
  // Golf instance role; only populated for a verified local-password session.
  bool is_instance_admin = 5;
}

message Repository {
  string id = 1;
  string name = 2;
  string full_name = 3;
  string description = 4;
  bool private = 5;
  string html_url = 6;
  string default_branch = 7;
  string updated_at = 8;
  bool empty = 9;
  string clone_url = 10;
  string ssh_url = 11;
}

message RepositoryKey {
  string owner = 1;
  string name = 2;
}

message PageRequest {
  // Zero means the default: page 1, limit 20. Bounds are page <=10000, limit <=100.
  uint32 page = 1;
  uint32 limit = 2;
}

message PageResponse {
  // Zero means no further page. Preserve the upstream's bounded page semantics.
  uint32 next_page = 1;
}

message LoginWithPasswordRequest {
  string username = 1;
  string password = 2;
}
message LoginWithPasswordResponse { User user = 1; }
message LoginWithGiteaTokenRequest { string token = 1; }
message LoginWithGiteaTokenResponse { User user = 1; }
message GetSessionRequest {}
message GetSessionResponse { User user = 1; }
message SessionInfo {
  // Non-credential decimal identifier, always scoped to the authenticated user.
  string id = 1;
  string created_at = 2;
  string expires_at = 3;
  bool current = 4;
  // Current supported sign-in kinds: pat, oauth or local. No token is returned.
  string credential_kind = 5;
}
message ListSessionsRequest { PageRequest page = 1; }
message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
  PageResponse page = 2;
}
message RevokeSessionRequest { string session_id = 1; }
message RevokeSessionResponse { bool current_session_revoked = 1; }
message RevokeOtherSessionsRequest {}
message RevokeOtherSessionsResponse { uint64 revoked_count = 1; }
message LogoutRequest {}
message LogoutResponse {}

message ListRepositoriesRequest { PageRequest page = 1; }
message ListRepositoriesResponse {
  repeated Repository repositories = 1;
  PageResponse page = 2;
}
message CreateRepositoryRequest {
  string name = 1;
  string description = 2;
  // Presence is required: an omitted value must never silently create publicly.
  optional bool private = 3;
  // Optional for compatibility. Supply one canonical UUID v4 for safe retries;
  // the same account/key with different inputs is rejected. Keys do not expire.
  string idempotency_key = 4;
}
message CreateRepositoryResponse {
  Repository repository = 1;
  RepositoryCreation creation = 2;
}
enum RepositoryCreationState {
  REPOSITORY_CREATION_STATE_UNSPECIFIED = 0;
  REPOSITORY_CREATION_STATE_OUTCOME_UNKNOWN = 1;
  REPOSITORY_CREATION_STATE_SUCCEEDED = 2;
  REPOSITORY_CREATION_STATE_REJECTED = 3;
}
// Own-account operation evidence, not a repository access grant. An unknown
// outcome can include in-flight work; no automatic provider retry is permitted.
message RepositoryCreation {
  string id = 1;
  string idempotency_key = 2;
  RepositoryCreationState state = 3;
  string requested_name = 4;
  bool private = 5;
  string created_at = 6;
  string updated_at = 7;
  string repository_id = 8;
  // Bounded category only; never provider response bodies or request secrets.
  string failure_code = 9;
}
message GetRepositoryCreationRequest { string idempotency_key = 1; }
message GetRepositoryCreationResponse {
  RepositoryCreation creation = 1;
  // Present only after a successful current provider read of the same ID.
  Repository repository = 2;
}
message GetRepositoryRequest { RepositoryKey repository = 1; }
message GetRepositoryResponse { Repository repository = 1; }

message Branch {
  string name = 1;
  string commit_id = 2;
  // Upstream metadata only; not a claim of qualified Golf merge policy.
  bool protected = 3;
}
message ListBranchesRequest {
  RepositoryKey repository = 1;
  PageRequest page = 2;
}
message ListBranchesResponse {
  repeated Branch branches = 1;
  PageResponse page = 2;
}
message Commit {
  string sha = 1;
  string message = 2;
  string author_name = 3;
  string authored_at = 4;
}
message ListCommitsRequest {
  RepositoryKey repository = 1;
  string ref = 2;
  PageRequest page = 3;
}
message ListCommitsResponse {
  repeated Commit commits = 1;
  PageResponse page = 2;
}

enum CommitDiffBase {
  COMMIT_DIFF_BASE_UNSPECIFIED = 0;
  COMMIT_DIFF_BASE_ROOT = 1;
  COMMIT_DIFF_BASE_FIRST_PARENT = 2;
}
message GetCommitDiffRequest {
  RepositoryKey repository = 1;
  // Full lowercase immutable object ID. Branches and revision expressions denied.
  string commit_id = 2;
}
message GetCommitDiffResponse {
  Commit commit = 1;
  repeated string parent_commit_ids = 2;
  // Empty for root commits; otherwise the first parent, including merges.
  string base_commit_id = 3;
  CommitDiffBase base = 4;
  // Native Gitea output, including root-commit preamble. UTF-8, at most 512 KiB;
  // never silently truncated. This is not a parsed patch or merge evidence.
  string raw_diff = 5;
  uint32 byte_size = 6;
}

enum SourceEntryType {
  SOURCE_ENTRY_TYPE_UNSPECIFIED = 0;
  SOURCE_ENTRY_TYPE_DIRECTORY = 1;
  SOURCE_ENTRY_TYPE_FILE = 2;
  SOURCE_ENTRY_TYPE_SYMLINK = 3;
  SOURCE_ENTRY_TYPE_SUBMODULE = 4;
}
message SourceEntry {
  string name = 1;
  string path = 2;
  SourceEntryType type = 3;
  string sha = 4;
  // Integral bytes, preserved without JavaScript precision loss.
  uint64 size = 5;
}
message SourceFile {
  SourceEntry entry = 1;
  // Present even for an empty text file; absent for a metadata-only preview.
  optional string content = 2;
  string preview_reason = 3;
}
message GetContentsRequest {
  RepositoryKey repository = 1;
  string ref = 2;
  string path = 3;
}
message GetContentsResponse {
  string commit_id = 1;
  string path = 2;
  SourceEntryType kind = 3;
  repeated SourceEntry entries = 4;
  SourceFile file = 5;
}

enum IssueState {
  ISSUE_STATE_UNSPECIFIED = 0;
  ISSUE_STATE_OPEN = 1;
  ISSUE_STATE_CLOSED = 2;
  ISSUE_STATE_ALL = 3;
}
message Issue {
  string id = 1;
  uint32 number = 2;
  string title = 3;
  string body = 4;
  IssueState state = 5;
  User user = 6;
  uint32 comments = 7;
  string created_at = 8;
  string updated_at = 9;
  string html_url = 10;
}
message ListIssuesRequest {
  RepositoryKey repository = 1;
  // Unspecified defaults to open. Other unknown enum values are invalid.
  IssueState state = 2;
  PageRequest page = 3;
}
message ListIssuesResponse {
  repeated Issue issues = 1;
  PageResponse page = 2;
}
message GetIssueRequest {
  RepositoryKey repository = 1;
  uint32 number = 2;
}
message GetIssueResponse { Issue issue = 1; }

message IssueComment {
  string id = 1;
  // Absent for a deleted or unavailable native author.
  User user = 2;
  string body = 3;
  string created_at = 4;
  string updated_at = 5;
  string html_url = 6;
}
message ListIssueCommentsRequest {
  RepositoryKey repository = 1;
  // Expected native IDs bind the displayed discussion; canonical decimal strings.
  string repository_id = 2;
  uint32 number = 3;
  string issue_id = 4;
  PageRequest page = 5;
}
message ListIssueCommentsResponse {
  repeated IssueComment comments = 1;
  // Native repository-wide pages filtered to this issue. Empty pages may advance.
  PageResponse page = 2;
}
enum IssueMutationKind {
  ISSUE_MUTATION_KIND_UNSPECIFIED = 0;
  ISSUE_MUTATION_KIND_CREATE_ISSUE = 1;
  ISSUE_MUTATION_KIND_CREATE_COMMENT = 2;
}
enum IssueMutationState {
  ISSUE_MUTATION_STATE_UNSPECIFIED = 0;
  ISSUE_MUTATION_STATE_OUTCOME_UNKNOWN = 1;
  ISSUE_MUTATION_STATE_SUCCEEDED = 2;
  ISSUE_MUTATION_STATE_REJECTED = 3;
}
// Owner-scoped observations, not exactly-once effects or target-side predicates.
message IssueMutation {
  string id = 1;
  string idempotency_key = 2;
  IssueMutationKind kind = 3;
  IssueMutationState state = 4;
  RepositoryKey repository = 5;
  string repository_id = 6;
  string issue_id = 7;
  uint32 number = 8;
  string comment_id = 9;
  string created_at = 10;
  string updated_at = 11;
  string failure_code = 12;
  // Provisional native receipt; does not establish successful target binding.
  string observed_result_id = 13;
  uint32 observed_number = 14;
}
message CreateIssueRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string title = 3;
  string body = 4;
  // Required canonical lowercase UUID v4; exact input is frozen per owner/key.
  string idempotency_key = 5;
}
message CreateIssueResponse {
  IssueMutation mutation = 1;
  // Optional: observed success does not grant current native access.
  Issue issue = 2;
}
message CreateIssueCommentRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  uint32 number = 3;
  string issue_id = 4;
  string body = 5;
  string idempotency_key = 6;
}
message CreateIssueCommentResponse {
  IssueMutation mutation = 1;
  IssueComment comment = 2;
}
message GetIssueMutationRequest { string idempotency_key = 1; }
message GetIssueMutationResponse {
  IssueMutation mutation = 1;
  Issue issue = 2;
  IssueComment comment = 3;
}

// Native provider observations, never Golf merge eligibility or a freshness proof.
message PullRequestRef {
  // Empty when the source repository was deleted or is unavailable.
  string repository_id = 1;
  string label = 2;
  string ref = 3;
  // May be empty when the provider cannot resolve the reference.
  string commit_id = 4;
  // True for list heads (provider retained PR snapshot) and detail retained refs.
  // False does not establish a live source read or any atomic freshness claim.
  bool retained_snapshot = 5;
}
message PullRequest {
  string id = 1;
  uint32 number = 2;
  string title = 3;
  string body = 4;
  IssueState state = 5;
  // Absent for a deleted or unavailable provider author.
  User user = 6;
  string created_at = 7;
  string updated_at = 8;
  string html_url = 9;
  bool draft = 10;
  bool merged = 11;
  string merged_at = 12;
  string merge_commit_id = 13;
  PullRequestRef head = 14;
  PullRequestRef base = 15;
}
message ListPullRequestsRequest {
  RepositoryKey repository = 1;
  // Unspecified defaults to open; ALL includes merged and unmerged closed PRs.
  IssueState state = 2;
  PageRequest page = 3;
}
message ListPullRequestsResponse {
  repeated PullRequest pull_requests = 1;
  PageResponse page = 2;
}
message GetPullRequestRequest {
  RepositoryKey repository = 1;
  uint32 number = 2;
}
message GetPullRequestResponse { PullRequest pull_request = 1; }

enum PullRequestReviewState {
  PULL_REQUEST_REVIEW_STATE_UNSPECIFIED = 0;
  PULL_REQUEST_REVIEW_STATE_APPROVED = 1;
  PULL_REQUEST_REVIEW_STATE_PENDING = 2;
  PULL_REQUEST_REVIEW_STATE_COMMENT = 3;
  PULL_REQUEST_REVIEW_STATE_REQUEST_CHANGES = 4;
  PULL_REQUEST_REVIEW_STATE_REQUEST_REVIEW = 5;
}
message PullRequestReview {
  string id = 1;
  // Absent for a deleted/unavailable author or a native team review request.
  User user = 2;
  string body = 3;
  PullRequestReviewState state = 4;
  string commit_id = 5;
  // Native flags only; these do not determine an eligible Golf approval.
  bool stale = 6;
  bool dismissed = 7;
  bool official = 8;
  string submitted_at = 9;
  string updated_at = 10;
  string html_url = 11;
}
message ListPullRequestReviewsRequest {
  RepositoryKey repository = 1;
  uint32 number = 2;
  PageRequest page = 3;
}
message ListPullRequestReviewsResponse {
  // Provider filtering can produce an empty page that still has a next page.
  repeated PullRequestReview reviews = 1;
  PageResponse page = 2;
}

enum CapabilityState {
  CAPABILITY_STATE_UNSPECIFIED = 0;
  CAPABILITY_STATE_DISABLED = 1;
  CAPABILITY_STATE_UNCONFIGURED = 2;
  CAPABILITY_STATE_READY = 3;
  CAPABILITY_STATE_DEGRADED = 4;
}
message Capability {
  string id = 1;
  string label = 2;
  CapabilityState state = 3;
  string reason = 4;
}
message ListCapabilitiesRequest {}
message ListCapabilitiesResponse { repeated Capability capabilities = 1; }

message GetAuthenticationOptionsRequest {}
message GetAuthenticationOptionsResponse {
  bool gitea_oauth_enabled = 1;
  string provider_label = 2;
  repeated string scopes = 3;
  bool local_password_enabled = 4;
}
message BeginGiteaOAuthRequest {}
message BeginGiteaOAuthResponse { string authorization_url = 1; }

enum OrganizationVisibility {
  ORGANIZATION_VISIBILITY_UNSPECIFIED = 0;
  ORGANIZATION_VISIBILITY_PUBLIC = 1;
  ORGANIZATION_VISIBILITY_LIMITED = 2;
  ORGANIZATION_VISIBILITY_PRIVATE = 3;
}

enum TeamVisibility {
  TEAM_VISIBILITY_UNSPECIFIED = 0;
  TEAM_VISIBILITY_PUBLIC = 1;
  TEAM_VISIBILITY_LIMITED = 2;
  TEAM_VISIBILITY_PRIVATE = 3;
}

enum TeamPermission {
  TEAM_PERMISSION_UNSPECIFIED = 0;
  TEAM_PERMISSION_NONE = 1;
  TEAM_PERMISSION_READ = 2;
  TEAM_PERMISSION_WRITE = 3;
  TEAM_PERMISSION_ADMIN = 4;
  TEAM_PERMISSION_OWNER = 5;
}

message Organization {
  string id = 1;
  string name = 2;
  string full_name = 3;
  string description = 4;
  OrganizationVisibility visibility = 5;
}
message OrganizationTeam {
  string id = 1;
  string name = 2;
  string description = 3;
  // Native provider metadata, not a computed effective Golf role.
  TeamPermission permission = 4;
  map<string, TeamPermission> unit_permissions = 5;
  bool includes_all_repositories = 6;
  TeamVisibility visibility = 7;
}
message ListOrganizationsRequest { PageRequest page = 1; }
message ListOrganizationsResponse {
  repeated Organization organizations = 1;
  PageResponse page = 2;
}
message GetOrganizationRequest { string organization = 1; }
message GetOrganizationResponse { Organization organization = 1; }
message ListTeamsRequest {
  string organization = 1;
  PageRequest page = 2;
}
message ListTeamsResponse {
  repeated OrganizationTeam teams = 1;
  PageResponse page = 2;
}
message GetTeamRequest {
  string organization = 1;
  string team_id = 2;
}
message GetTeamResponse { OrganizationTeam team = 1; }
message ListTeamMembersRequest {
  string organization = 1;
  string team_id = 2;
  PageRequest page = 3;
}
message ListTeamMembersResponse {
  repeated User members = 1;
  PageResponse page = 2;
}
message ListTeamRepositoriesRequest {
  string organization = 1;
  string team_id = 2;
  PageRequest page = 3;
}
message ListTeamRepositoriesResponse {
  repeated Repository repositories = 1;
  PageResponse page = 2;
}

// These actions describe committed local session changes, not provider writes.
enum AuditAction {
  AUDIT_ACTION_UNSPECIFIED = 0;
  AUDIT_ACTION_SIGN_IN = 1;
  AUDIT_ACTION_SIGN_OUT = 2;
  AUDIT_ACTION_SESSION_REVOKED = 3;
  AUDIT_ACTION_OTHER_SESSIONS_REVOKED = 4;
  AUDIT_ACTION_SESSION_REPLACED = 5;
}
message AuditEvent {
  string id = 1;
  string occurred_at = 2;
  AuditAction action = 3;
  string actor_session_id = 4;
  // Absent for bulk revocation; this identifier is never a cookie/credential.
  string target_session_id = 5;
  string credential_kind = 6;
  uint64 revoked_count = 7;
  // Random non-secret operation identifier; no cross-account identity linkage.
  string operation_id = 8;
  // Only SIGN_IN: the new session's absolute expiry, not an event retention date.
  optional string expires_at = 9;
}
message ListAuditEventsRequest {
  // Zero defaults to 20; maximum 100.
  uint32 limit = 1;
  // Canonical positive signed-int64 own-event ID. Requires snapshot_id; <= snapshot_id.
  string before_id = 2;
  // Omit to capture a new own-account upper bound. Reuse on following pages.
  // Supplied values must identify an existing event in this account.
  string snapshot_id = 3;
}
message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  // Last returned ID only when another page exists; otherwise empty.
  string next_before_id = 2;
  // Empty only for history without any events. No pre-migration history is invented.
  string snapshot_id = 3;
}

message GetTeamAdministrationRequest {
  string organization = 1;
  string team_id = 2;
}
message GetTeamAdministrationResponse {
  string organization_id = 1;
  OrganizationTeam team = 2;
  bool can_manage_members = 3;
  // Observation fingerprint, not an atomic native version lock.
  string revision = 4;
  bool is_owner_team = 5;
}
message ResolveTeamMemberRequest {
  string organization = 1;
  string organization_id = 2;
  string team_id = 3;
  string user_login = 4;
  string expected_revision = 5;
}
message ResolveTeamMemberResponse {
  User user = 1;
  bool is_member = 2;
}
message AddTeamMemberRequest {
  string organization = 1;
  string organization_id = 2;
  string team_id = 3;
  string user_login = 4;
  string expected_revision = 5;
  string user_id = 6;
}
message AddTeamMemberResponse { User user = 1; bool is_member = 2; }
message RemoveTeamMemberRequest {
  string organization = 1;
  string organization_id = 2;
  string team_id = 3;
  string user_login = 4;
  string expected_revision = 5;
  string user_id = 6;
}
message RemoveTeamMemberResponse { User user = 1; bool is_member = 2; }

message LocalAccountInfo {
  string id = 1;
  string username = 2;
  string email = 3;
  string native_user_id = 4;
  bool is_instance_admin = 5;
  bool disabled = 6;
  string credential_version = 7;
  string created_at = 8;
  optional string disabled_at = 9;
  string golf_user_id = 10;
}
message ListLocalAccountsRequest { PageRequest page = 1; }
message ListLocalAccountsResponse {
  repeated LocalAccountInfo accounts = 1;
  PageResponse page = 2;
}

// Direct personal-repository grants are distinct from effective native access.
service RepositoryAccessService {
  rpc GetRepositoryAccess(GetRepositoryAccessRequest) returns (GetRepositoryAccessResponse);
  rpc ListRepositoryCollaborators(ListRepositoryCollaboratorsRequest) returns (ListRepositoryCollaboratorsResponse);
  rpc ResolveRepositoryCollaborator(ResolveRepositoryCollaboratorRequest) returns (ResolveRepositoryCollaboratorResponse);
  rpc SetRepositoryCollaborator(SetRepositoryCollaboratorRequest) returns (SetRepositoryCollaboratorResponse);
  rpc RemoveRepositoryCollaborator(RemoveRepositoryCollaboratorRequest) returns (RemoveRepositoryCollaboratorResponse);
}
message RepositoryAccess {
  string repository_id = 1;
  string owner_id = 2;
  User owner = 3;
  bool organization_owned = 4;
  bool can_manage = 5;
  string revision = 6;
  string current_permission = 7;
}
message RepositoryCollaborator {
  User user = 1;
  string permission = 2;
  bool is_direct = 3;
  string revision = 4;
}
message GetRepositoryAccessRequest { RepositoryKey repository = 1; }
message GetRepositoryAccessResponse { RepositoryAccess access = 1; }
message ListRepositoryCollaboratorsRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string expected_revision = 4;
  PageRequest page = 5;
}
message ListRepositoryCollaboratorsResponse {
  repeated RepositoryCollaborator collaborators = 1;
  PageResponse page = 2;
}
message ResolveRepositoryCollaboratorRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string expected_revision = 4;
  string user_login = 5;
}
message ResolveRepositoryCollaboratorResponse { RepositoryCollaborator collaborator = 1; }
message SetRepositoryCollaboratorRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string expected_revision = 4;
  string user_login = 5;
  string user_id = 6;
  string expected_collaborator_revision = 7;
  string permission = 8;
}
message SetRepositoryCollaboratorResponse { RepositoryCollaborator collaborator = 1; }
message RemoveRepositoryCollaboratorRequest {
  RepositoryKey repository = 1;
  string repository_id = 2;
  string owner_id = 3;
  string expected_revision = 4;
  string user_login = 5;
  string user_id = 6;
  string expected_collaborator_revision = 7;
}
message RemoveRepositoryCollaboratorResponse { RepositoryCollaborator collaborator = 1; }

// Pinned, untrusted workflow-source inspection; this does not execute jobs.
service WorkflowService {
  rpc InspectWorkflows(InspectWorkflowsRequest) returns (InspectWorkflowsResponse);
}
enum WorkflowFormat {
  WORKFLOW_FORMAT_UNSPECIFIED = 0;
  WORKFLOW_FORMAT_GITHUB_ACTIONS = 1;
  WORKFLOW_FORMAT_GITLAB_CI = 2;
}
enum WorkflowInspectionState {
  WORKFLOW_INSPECTION_STATE_UNSPECIFIED = 0;
  WORKFLOW_INSPECTION_STATE_VALIDATED_SUBSET = 1;
  WORKFLOW_INSPECTION_STATE_UNSUPPORTED = 2;
  WORKFLOW_INSPECTION_STATE_INVALID = 3;
}
message WorkflowDiagnostic {
  string code = 1;
  string message = 2;
  uint32 line = 3;
  uint32 column = 4;
}
message WorkflowJobSummary { string id = 1; string name = 2; string stage = 3; uint32 step_count = 4; }
message WorkflowConfiguration {
  string path = 1;
  string blob_id = 2;
  uint64 byte_size = 3;
  WorkflowFormat format = 4;
  WorkflowInspectionState state = 5;
  string name = 6;
  repeated WorkflowJobSummary jobs = 7;
  repeated string events = 8;
  repeated WorkflowDiagnostic diagnostics = 9;
}
message InspectWorkflowsRequest { RepositoryKey repository = 1; string ref = 2; }
message InspectWorkflowsResponse {
  string repository_id = 1;
  string commit_id = 2;
  string catalog_version = 3;
  bool execution_available = 4;
  repeated WorkflowConfiguration configurations = 5;
  repeated WorkflowDiagnostic diagnostics = 6;
}
message DisableLocalAccountRequest {
  string account_id = 1;
  string expected_credential_version = 2;
  string password_confirmation = 3;
}
message DisableLocalAccountResponse {
  LocalAccountInfo account = 1;
  uint64 sessions_revoked = 2;
  string operation_id = 3;
}

// Browser-managed execution ceilings. Unset scopes deny execution.
service ExecutionPolicyService {
  rpc GetExecutionPolicy(GetExecutionPolicyRequest) returns (GetExecutionPolicyResponse);
  rpc UpdateExecutionPolicy(UpdateExecutionPolicyRequest) returns (UpdateExecutionPolicyResponse);
}
enum ExecutionScope {
  EXECUTION_SCOPE_UNSPECIFIED = 0;
  EXECUTION_SCOPE_INSTANCE = 1;
  EXECUTION_SCOPE_ORGANIZATION = 2;
  EXECUTION_SCOPE_REPOSITORY = 3;
}
enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_DISABLED = 1;
  EXECUTION_MODE_ALL = 2;
  EXECUTION_MODE_SELECTED = 3;
}
message ExecutionPolicy {
  ExecutionScope scope = 1;
  string scope_id = 2;
  string owner_id = 3;
  ExecutionMode mode = 4;
  repeated string selected_repository_ids = 5;
  bool manual_dispatch_enabled = 6;
  bool allow_all_workflows = 7;
  repeated string workflow_paths = 8;
  string revision = 9;
  string revocation_epoch = 10;
  bool can_edit = 11;
  string authority_revision = 12;
}
message GetExecutionPolicyRequest {
  ExecutionScope scope = 1;
  string organization = 2;
  RepositoryKey repository = 3;
}
message GetExecutionPolicyResponse { ExecutionPolicy policy = 1; }
message UpdateExecutionPolicyRequest {
  ExecutionScope scope = 1;
  string organization = 2;
  RepositoryKey repository = 3;
  string scope_id = 4;
  string expected_revision = 5;
  string expected_authority_revision = 6;
  ExecutionMode mode = 7;
  repeated string selected_repository_ids = 8;
  bool manual_dispatch_enabled = 9;
  bool allow_all_workflows = 10;
  repeated string workflow_paths = 11;
}
message UpdateExecutionPolicyResponse { ExecutionPolicy policy = 1; }

// Golf execution results are distinct from native required-check eligibility.
service WorkflowRunService {
  rpc DispatchWorkflow(DispatchWorkflowRequest) returns (DispatchWorkflowResponse);
  rpc GetWorkflowRun(GetWorkflowRunRequest) returns (GetWorkflowRunResponse);
  rpc ListWorkflowRuns(ListWorkflowRunsRequest) returns (ListWorkflowRunsResponse);
  rpc CancelWorkflowRun(CancelWorkflowRunRequest) returns (CancelWorkflowRunResponse);
  rpc GetWorkflowRunLogs(GetWorkflowRunLogsRequest) returns (GetWorkflowRunLogsResponse);
}
enum WorkflowRunState {
  WORKFLOW_RUN_STATE_UNSPECIFIED = 0;
  WORKFLOW_RUN_STATE_QUEUED = 1;
  WORKFLOW_RUN_STATE_RUNNING = 2;
  WORKFLOW_RUN_STATE_SUCCEEDED = 3;
  WORKFLOW_RUN_STATE_FAILED = 4;
  WORKFLOW_RUN_STATE_CANCELLED = 5;
  WORKFLOW_RUN_STATE_TIMED_OUT = 6;
  WORKFLOW_RUN_STATE_LOST = 7;
}
message WorkflowRun {
  string id = 1;
  string repository_id = 2;
  string owner_id = 3;
  string commit_id = 4;
  string workflow_path = 5;
  string workflow_blob_id = 6;
  WorkflowFormat format = 7;
  WorkflowRunState state = 8;
  string version = 9;
  string created_at = 10;
  optional string started_at = 11;
  optional string finished_at = 12;
  optional int32 exit_code = 13;
  string reason = 14;
  string runner_id = 15;
  string source_sha256 = 16;
  bool logs_truncated = 17;
  bool can_cancel = 18;
}
message DispatchWorkflowRequest { RepositoryKey repository = 1; string ref = 2; string workflow_path = 3; string idempotency_key = 4; }
message DispatchWorkflowResponse { WorkflowRun run = 1; }
message GetWorkflowRunRequest { string run_id = 1; }
message GetWorkflowRunResponse { WorkflowRun run = 1; }
message ListWorkflowRunsRequest { RepositoryKey repository = 1; PageRequest page = 2; }
message ListWorkflowRunsResponse { repeated WorkflowRun runs = 1; PageResponse page = 2; }
message CancelWorkflowRunRequest { string run_id = 1; string expected_version = 2; }
message CancelWorkflowRunResponse { WorkflowRun run = 1; }
message WorkflowRunLog { uint64 sequence = 1; string text = 2; }
message GetWorkflowRunLogsRequest { string run_id = 1; uint64 after_sequence = 2; }
message GetWorkflowRunLogsResponse { repeated WorkflowRunLog logs = 1; bool has_more = 2; bool truncated = 3; }

// Golf API ceiling; independently exposed native APIs remain separate.
service OrganizationCreationService {
 rpc GetOrganizationCreationPolicy(GetOrganizationCreationPolicyRequest) returns (GetOrganizationCreationPolicyResponse);
 rpc UpdateOrganizationCreationPolicy(UpdateOrganizationCreationPolicyRequest) returns (UpdateOrganizationCreationPolicyResponse);
 rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
}
enum OrganizationCreationMode {
 ORGANIZATION_CREATION_MODE_UNSPECIFIED = 0;
 ORGANIZATION_CREATION_MODE_ADMINISTRATORS_ONLY = 1;
 ORGANIZATION_CREATION_MODE_SELECTED_USERS = 2;
 ORGANIZATION_CREATION_MODE_ALL_USERS = 3;
}
message OrganizationCreationPolicy {
 OrganizationCreationMode mode = 1;
 repeated string selected_golf_user_ids = 2;
 string revision = 3;
 string revocation_epoch = 4;
 bool can_edit = 5;
 // Golf policy permission to request creation, not native permission proof.
 bool can_create = 6;
 string enforcement_scope = 7;
 bool native_authority_known = 8;
}
message GetOrganizationCreationPolicyRequest {}
message GetOrganizationCreationPolicyResponse { OrganizationCreationPolicy policy = 1; }
message UpdateOrganizationCreationPolicyRequest {
 string expected_revision = 1;
 OrganizationCreationMode mode = 2;
 repeated string selected_golf_user_ids = 3;
}
message UpdateOrganizationCreationPolicyResponse { OrganizationCreationPolicy policy = 1; }
message CreateOrganizationRequest {
 string username = 1;
 string full_name = 2;
 string description = 3;
 string visibility = 4;
 string expected_policy_revision = 5;
}
message CreateOrganizationResponse { Organization organization = 1; }

// Installation connection profiles are saved desired configurations. Saving or
// testing never switches a live database pool or activates an object consumer.
service InfrastructureConnectionService {
 rpc ListInfrastructureConnections(ListInfrastructureConnectionsRequest) returns (ListInfrastructureConnectionsResponse);
 rpc SaveInfrastructureConnection(SaveInfrastructureConnectionRequest) returns (SaveInfrastructureConnectionResponse);
 rpc TestInfrastructureConnection(TestInfrastructureConnectionRequest) returns (TestInfrastructureConnectionResponse);
 rpc ActivateInfrastructureConnection(ActivateInfrastructureConnectionRequest) returns (ActivateInfrastructureConnectionResponse);
}
message InfrastructureConnection {
 string id = 1;
 string version = 2;
 string label = 3;
 string kind = 4;
 string database_role = 5;
 string backend = 6;
 string endpoint = 7;
 string region = 8;
 string bucket = 9;
 bool path_style = 10;
 string tls_mode = 11;
 string database_name = 12;
 string database_user = 13;
 bool has_credential = 14;
 string activation_state = 15;
 string prefix = 16;
 bool allow_insecure = 17;
 string created_at = 18;
}
message InfrastructureConnectionCredential {
 string database_password = 1;
 string access_key_id = 2;
 string secret_access_key = 3;
 string session_token = 4;
}
message ListInfrastructureConnectionsRequest { PageRequest page = 1; }
message ListInfrastructureConnectionsResponse { repeated InfrastructureConnection connections = 1; PageResponse page = 2; string active_revision = 3; string active_connection_id = 4; string active_connection_version = 5; repeated InfrastructureConnection deployment_defaults = 6; }
message SaveInfrastructureConnectionRequest {
 InfrastructureConnection connection = 1;
 string expected_version = 2;
 optional InfrastructureConnectionCredential credential = 3;
 bool retain_credential = 4;
 string password_confirmation = 5;
}
message SaveInfrastructureConnectionResponse { InfrastructureConnection connection = 1; }
message TestInfrastructureConnectionRequest { string id = 1; string expected_version = 2; string password_confirmation = 3; }
message TestInfrastructureConnectionResponse { bool accessible = 1; string result_code = 2; string checked_at = 3; string qualification_scope = 4; }

message ActivateInfrastructureConnectionRequest { string id = 1; string expected_version = 2; string password_confirmation = 3; string expected_active_revision = 4; }
message ActivateInfrastructureConnectionResponse { InfrastructureConnection connection = 1; string active_revision = 2; }
