  PULL_MERGE_TARGET_PROTECTION_UNSPECIFIED = 0;
  PULL_MERGE_TARGET_PROTECTION_UNKNOWN = 1;
  PULL_MERGE_TARGET_PROTECTION_UNPROTECTED = 2;
  PULL_MERGE_TARGET_PROTECTION_PROTECTED = 3;
}
