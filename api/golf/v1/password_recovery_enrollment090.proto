syntax = "proto3";
package golf.v1;
option go_package = "github.com/mjtechguy/golf-git/gen/golf/v1;golfv1";

// Own local-password consent, independent from notification-mail preferences.
service PasswordRecoveryEnrollmentService {
  rpc GetOwnPasswordRecoveryEnrollment(GetOwnPasswordRecoveryEnrollmentRequest) returns (GetOwnPasswordRecoveryEnrollmentResponse);
  rpc SaveOwnPasswordRecoveryEnrollment(SaveOwnPasswordRecoveryEnrollmentRequest) returns (SaveOwnPasswordRecoveryEnrollmentResponse);
}
message GetOwnPasswordRecoveryEnrollmentRequest {}
message PasswordRecoveryEnrollment {
  string user_id = 1;
  string native_user_id = 2;
  string local_account_id = 3;
  string credential_version = 4;
  string contact_version = 5;
  string version = 6;
  string login_email = 7;
  // Effective only when the explicitly saved binding remains current.
  bool enabled = 8;
  bool enrollment_current = 9;
  bool email_verified = 10;
  bool mfa_enabled = 11;
}
message GetOwnPasswordRecoveryEnrollmentResponse { PasswordRecoveryEnrollment enrollment = 1; }
message SaveOwnPasswordRecoveryEnrollmentRequest {
  string local_account_id = 1;
  string native_user_id = 2;
  string expected_credential_version = 3;
  string expected_contact_version = 4;
  string expected_version = 5;
  bool enabled = 6;
  string password_confirmation = 7;
  string mfa_code = 8;
}
message SaveOwnPasswordRecoveryEnrollmentResponse { PasswordRecoveryEnrollment enrollment = 1; }
