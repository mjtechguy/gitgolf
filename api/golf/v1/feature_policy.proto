syntax = "proto3";
package golf.v1;
import "golf/v1/golf.proto";
option go_package = "github.com/mjtechguy/golf-git/gen/golf/v1;golfv1";

// GitHub-style feature policy. A feature is on for a repository only when the operator allocated it,
// the installation policy and (for organization repositories) the organization policy allow it, the
// repository has it turned on, and every feature it depends on is on. Organizations may only narrow
// the installation policy. Turning a feature off retains its data.
service FeaturePolicyService {
 rpc GetFeaturePolicy(GetFeaturePolicyRequest) returns (GetFeaturePolicyResponse);
 rpc UpdateFeaturePolicy(UpdateFeaturePolicyRequest) returns (UpdateFeaturePolicyResponse);
}
enum FeaturePolicyMode {
 FEATURE_POLICY_MODE_UNSPECIFIED = 0;
 // Off for every repository in scope.
 FEATURE_POLICY_MODE_DISABLED = 1;
 // Repositories choose; a missing policy row means allowed.
 FEATURE_POLICY_MODE_ALLOWED = 2;
 // On for every repository in scope; repositories cannot turn it off. Never valid for public repositories.
 FEATURE_POLICY_MODE_ENFORCED = 3;
}
enum FeaturePolicyScope {
 FEATURE_POLICY_SCOPE_UNSPECIFIED = 0;
 FEATURE_POLICY_SCOPE_INSTALLATION = 1;
 FEATURE_POLICY_SCOPE_ORGANIZATION = 2;
}
enum FeatureDecider {
 FEATURE_DECIDER_UNSPECIFIED = 0;
 FEATURE_DECIDER_OPERATOR = 1;
 FEATURE_DECIDER_INSTALLATION = 2;
 FEATURE_DECIDER_ORGANIZATION = 3;
 FEATURE_DECIDER_REPOSITORY = 4;
 FEATURE_DECIDER_DEPENDENCY = 5;
}
message FeaturePolicy {
 string feature = 1; FeaturePolicyMode mode = 2;
 // "0" when no policy row exists; an update must name the version it observed.
 string version = 3; string updated_by = 4; string updated_at = 5;
 string label = 6; string group = 7;
 // False when the deployment does not provide the feature; unavailable_reason then names why and the mode has no effect.
 bool allocated = 8; string unavailable_reason = 9;
 repeated string requires = 10;
 // Reach over active repositories in scope: where the feature is on now, after every level and dependency.
 uint32 repositories_on = 11; uint32 repositories_total = 12;
 // Whether repository administrators may turn this feature on or off themselves when the mode is ALLOWED.
 bool repository_choice = 13;
}
message GetFeaturePolicyRequest { FeaturePolicyScope scope = 1; string organization = 2; }
message GetFeaturePolicyResponse {
 FeaturePolicyScope scope = 1; string scope_id = 2; repeated FeaturePolicy policies = 3;
 string revision = 4; bool can_edit = 5; string last_changed_at = 6; string last_changed_by = 7;
}
message UpdateFeaturePolicyRequest {
 FeaturePolicyScope scope = 1; string organization = 2; string feature = 3; FeaturePolicyMode mode = 4;
 string expected_version = 5;
 // Widening (turning a feature on, or requiring it everywhere) needs the feature id typed back.
 string confirmation = 6; string operation_id = 7;
}
message UpdateFeaturePolicyResponse { FeaturePolicy policy = 1; string revision = 2; }

service RepositoryFeatureService {
 rpc GetRepositoryFeatures(GetRepositoryFeaturesRequest) returns (GetRepositoryFeaturesResponse);
 rpc UpdateRepositoryFeatures(UpdateRepositoryFeaturesRequest) returns (UpdateRepositoryFeaturesResponse);
}
message RepositoryFeature {
 string feature = 1; bool effective = 2; FeatureDecider decided_by = 3; string reason = 4;
 // The repository's own choice, kept while a higher level overrides it.
 bool repository_enabled = 5; bool can_change = 6; string revision = 7;
 string label = 8; string group = 9; repeated string requires = 10;
 // On for every repository in scope by an installation or organization requirement.
 bool required = 11;
 // Settings beyond on/off for one feature (for example an AI model choice where the installation allows a
 // repository override) are added as fields here and on FeaturePolicy; the web shows them under the feature.
}
message GetRepositoryFeaturesRequest { RepositoryKey repository = 1; string repository_id = 2; }
message GetRepositoryFeaturesResponse {
 string repository_id = 1; repeated RepositoryFeature features = 2; string revision = 3; bool can_edit = 4;
}
message RepositoryFeatureChange { string feature = 1; bool enabled = 2; }
message UpdateRepositoryFeaturesRequest {
 RepositoryKey repository = 1; string repository_id = 2; string expected_revision = 3;
 repeated RepositoryFeatureChange changes = 4;
}
message UpdateRepositoryFeaturesResponse {
 string repository_id = 1; repeated RepositoryFeature features = 2; string revision = 3; bool can_edit = 4;
}
