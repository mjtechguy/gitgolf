syntax = "proto3";
package golf.v1;
option go_package = "github.com/mjtechguy/golf-git/gen/golf/v1;golfv1";

// Public same-origin recovery. Neither operation creates a login session or resets MFA.
service PasswordRecoveryService {
  rpc RequestPasswordRecovery(RequestPasswordRecoveryRequest) returns (RequestPasswordRecoveryResponse);
  rpc CompletePasswordRecovery(CompletePasswordRecoveryRequest) returns (CompletePasswordRecoveryResponse);
}
message RequestPasswordRecoveryRequest {
  string email = 1;
  string operation_id = 2;
}
message RequestPasswordRecoveryResponse { string message = 1; }
message CompletePasswordRecoveryRequest {
  string recovery_code = 1;
  string new_password = 2;
}
message CompletePasswordRecoveryResponse { bool requires_login = 1; }
