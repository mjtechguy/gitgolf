proof:
  image: alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0
  before_script:
    - value=shared
    - mkdir prepared
    - cd prepared
  script:
    - test "$value" = shared
    - test "${PWD##*/}" = prepared
    - cd ..
    - test -f README.md
    - printf "gitlab proof\n"
