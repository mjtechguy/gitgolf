global:
  scrape_interval: 5s
  scrape_timeout: 3s
scrape_configs:
  - job_name: golf
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/golf_metrics_token
    static_configs:
      - targets: [golf:9090]
    body_size_limit: 2MB
    sample_limit: 10000
    label_limit: 10
    label_value_length_limit: 256
