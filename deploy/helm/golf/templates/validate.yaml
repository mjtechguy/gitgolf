{{- if gt (len .Release.Name) 45 -}}{{ fail "Golf release names must have at most 45 characters" }}{{- end -}}
{{- $_ := required "existingSecret must reference a precreated Secret" .Values.existingSecret -}}
{{- range $name, $image := dict "Golf" .Values.image "Forgejo" .Values.forgejo.image "PostgreSQL" .Values.postgresql.image -}}
  {{- $_ := required (printf "%s image.repository is required" $name) $image.repository -}}
  {{- if or (contains ":" (last (splitList "/" $image.repository))) (hasSuffix "/" $image.repository) -}}{{ fail (printf "%s image.repository must not contain a tag or digest" $name) }}{{- end -}}
  {{- if not (or $image.tag $image.digest) -}}{{ fail (printf "%s requires an explicit image tag or digest" $name) }}{{- end -}}
  {{- if or (eq (lower $image.tag) "latest") (and $image.tag $image.digest) -}}{{ fail (printf "%s requires exactly one tag or digest, never latest" $name) }}{{- end -}}
{{- end -}}
{{- range $name, $value := dict "publicURL" .Values.publicURL "forgejo.publicURL" .Values.forgejo.publicURL -}}
  {{- $_ := required (printf "%s is required" $name) $value -}}
  {{- if not (regexMatch "^https?://[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?(:[0-9]{1,5})?/?$" $value) -}}{{ fail (printf "%s must be an HTTP(S) origin without credentials, path, query or fragment" $name) }}{{- end -}}
  {{- if and (hasPrefix "http://" $value) (not (and $.Values.allowInsecureCookies (regexMatch "^http://(localhost|127\\.[0-9]+\\.[0-9]+\\.[0-9]+)(:[0-9]{1,5})?/?$" $value))) -}}{{ fail (printf "%s requires HTTPS except explicit loopback development" $name) }}{{- end -}}
{{- end -}}
{{- if and .Values.allowInsecureCookies (not (regexMatch "^https?://(localhost|127\\.[0-9]+\\.[0-9]+\\.[0-9]+)(:[0-9]{1,5})?/?$" .Values.publicURL)) -}}{{ fail "allowInsecureCookies is allowed only for a loopback Golf publicURL" }}{{- end -}}
{{- if not .Values.forgejo.enabled -}}
  {{- $_ := required "forgejo.externalURL is required when bundled Forgejo is disabled" .Values.forgejo.externalURL -}}
  {{- if not (regexMatch "^https?://[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?(:[0-9]{1,5})?(/[^?#@]*)?$" .Values.forgejo.externalURL) -}}{{ fail "forgejo.externalURL must be an HTTP(S) endpoint without credentials or query" }}{{- end -}}
{{- else if .Values.forgejo.externalURL -}}{{ fail "forgejo.externalURL cannot be set while bundled Forgejo is enabled" }}{{- end -}}
{{- if and (not .Values.postgresql.enabled) .Values.forgejo.enabled -}}
  {{- $_ := required "forgejo.database.host is required for external PostgreSQL" .Values.forgejo.database.host -}}
{{- end -}}
{{- if and .Values.networkPolicy.enabled (or (not .Values.forgejo.enabled) (not .Values.postgresql.enabled)) (empty .Values.networkPolicy.externalEgress) -}}{{ fail "networkPolicy.externalEgress must explicitly permit external dependencies" }}{{- end -}}
{{- if .Values.ingress.enabled -}}
  {{- $_ := required "ingress.className must explicitly select your controller" .Values.ingress.className -}}
  {{- if and .Values.networkPolicy.enabled (empty .Values.networkPolicy.ingressFrom) -}}{{ fail "networkPolicy.ingressFrom must permit your ingress controller" }}{{- end -}}
  {{- if or (hasPrefix "https://" .Values.publicURL) (and .Values.forgejo.enabled (hasPrefix "https://" .Values.forgejo.publicURL)) -}}
    {{- $_ := required "ingress.tlsSecret is required for HTTPS public URLs" .Values.ingress.tlsSecret -}}
  {{- end -}}
  {{- if and .Values.forgejo.enabled (eq (regexReplaceAll ":[0-9]+$" (urlParse .Values.publicURL).host "") (regexReplaceAll ":[0-9]+$" (urlParse .Values.forgejo.publicURL).host "")) -}}{{ fail "Golf and bundled Forgejo ingress require distinct public hosts" }}{{- end -}}
{{- end -}}

{{- if and .Values.postgresql.enabled .Values.forgejo.enabled (or (ne .Values.forgejo.database.name "forgejo") (ne .Values.forgejo.database.user "forgejo")) -}}{{ fail "bundled PostgreSQL initializes Forgejo database/name as forgejo; use those fixed roles" }}{{- end -}}
{{- if and .Values.forgejo.enabled .Values.forgejo.image.tag (ne .Values.forgejo.image.tag "15.0.9-rootless") -}}{{ fail "bundled Forgejo requires qualified rootless version 15.0.9" }}{{- end -}}
{{- if and .Values.postgresql.enabled .Values.postgresql.image.tag (ne .Values.postgresql.image.tag "18.4-alpine3.24") -}}{{ fail "bundled PostgreSQL requires qualified Alpine tag 18.4-alpine3.24 or its pinned digest" }}{{- end -}}

{{- with .Values.observability.tracing.endpoint -}}
  {{- if not (regexMatch "^https?://[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?(:[0-9]{1,5})?(/[^?#@]*)?$" .) -}}{{ fail "tracing.endpoint requires HTTP(S) without credentials, query or fragment" }}{{- end -}}
  {{- if and (hasPrefix "http://" .) (not $.Values.observability.tracing.insecure) -}}{{ fail "HTTP tracing requires explicit tracing.insecure" }}{{- end -}}
  {{- if and $.Values.networkPolicy.enabled (empty $.Values.networkPolicy.externalEgress) -}}{{ fail "tracing requires explicit networkPolicy.externalEgress for the collector" }}{{- end -}}
{{- end -}}

{{- if ne .Values.forge.kind "forgejo" -}}{{ fail "Only Forgejo is supported for new installations" }}{{- end -}}
  {{- $_ := required "Forgejo requires forge.instanceID for this fresh installation" .Values.forge.instanceID -}}
  {{- if ne .Values.forgejo.qualifiedVersion "15.0.9" -}}{{ fail "Forgejo requires qualifiedVersion 15.0.9" }}{{- end -}}
  {{- if and .Values.forgejo.enabled (or (ne .Values.forgejo.image.repository "codeberg.org/forgejo/forgejo") (ne .Values.forgejo.image.digest "sha256:caf1bca332f95cdcf124227a4bfa3b49bbbfbbc8a5e4a97406921cb581165413")) -}}{{ fail "Forgejo requires the qualified exact image digest" }}{{- end -}}
  {{- if .Release.IsUpgrade -}}
    {{- $existing := lookup "apps/v1" "Deployment" .Release.Namespace (include "golf.fullname" .) -}}
    {{- $bound := false -}}
    {{- if $existing -}}{{- range $container := $existing.spec.template.spec.containers -}}{{- range $env := $container.env -}}
      {{- if and (eq $env.name "GOLF_FORGE_KIND") (eq $env.value "forgejo") -}}{{- $bound = true -}}{{- end -}}
    {{- end -}}{{- end -}}{{- end -}}
    {{- if not $bound -}}{{ fail "Only an existing Forgejo release can be upgraded" }}{{- end -}}
  {{- end -}}
