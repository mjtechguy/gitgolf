{{- if .Values.forgejo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "golf.fullname" . }}-forgejo
  labels:
    {{- include "golf.labels" . | nindent 4 }}
    app.kubernetes.io/component: forgejo
spec:
  clusterIP: None
  selector:
    {{- include "golf.selector" . | nindent 4 }}
    app.kubernetes.io/component: forgejo
  ports:
    - {name: http, port: 3000, targetPort: http}
    - {name: ssh, port: 2222, targetPort: ssh}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "golf.fullname" . }}-forgejo
  labels:
    {{- include "golf.labels" . | nindent 4 }}
    app.kubernetes.io/component: forgejo
spec:
  serviceName: {{ include "golf.fullname" . }}-forgejo
  # One canonical filesystem writer. Do not scale this StatefulSet manually.
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy: {type: RollingUpdate}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels:
      {{- include "golf.selector" . | nindent 6 }}
      app.kubernetes.io/component: forgejo
  template:
    metadata:
      labels:
        {{- include "golf.selector" . | nindent 8 }}
        app.kubernetes.io/component: forgejo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: forgejo
          image: {{ include "golf.image" .Values.forgejo.image | quote }}
          imagePullPolicy: {{ .Values.forgejo.image.pullPolicy }}
          securityContext:
            {{- include "golf.containerSecurity" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 3000}
            - {name: ssh, containerPort: 2222}
          env:
            {{- if .Values.postgresql.existingCASecret }}
            - {name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/golf/postgres"}
            {{- end }}
            # Forgejo's upstream name: the image reads GITEA_APP_INI; /etc/gitea is its config path.
            - {name: GITEA_APP_INI, value: /etc/gitea/app.ini}
            - {name: FORGEJO__database__DB_TYPE, value: postgres}
            - name: FORGEJO__database__HOST
              value: {{ include "golf.postgresHost" . | quote }}
            - name: FORGEJO__database__NAME
              value: {{ .Values.forgejo.database.name | quote }}
            - name: FORGEJO__database__USER
              value: {{ .Values.forgejo.database.user | quote }}
            - name: FORGEJO__database__SSL_MODE
              value: {{ ternary "disable" .Values.forgejo.database.sslMode .Values.postgresql.enabled | quote }}
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: FORGEJO_DB_PASSWORD}
            - {name: FORGEJO__server__PUBLIC_URL_DETECTION, value: "never"}
            - name: FORGEJO__server__ROOT_URL
              value: {{ printf "%s/" (trimSuffix "/" .Values.forgejo.publicURL) | quote }}
            - name: FORGEJO__server__SSH_DOMAIN
              value: {{ regexReplaceAll ":[0-9]+$" (urlParse .Values.forgejo.publicURL).host "" | quote }}
            - name: FORGEJO__server__SSH_PORT
              value: {{ .Values.forgejo.sshPort | quote }}
            - {name: FORGEJO__server__SSH_LISTEN_PORT, value: "2222"}
            - {name: FORGEJO__security__INSTALL_LOCK, value: "true"}
            - {name: FORGEJO__service__DISABLE_REGISTRATION, value: "true"}
            - {name: FORGEJO__actions__ENABLED, value: "false"}
            - {name: FORGEJO__actions__WORKFLOW_DIRS, value: {{ .Values.forgejo.workflowDirs | quote }}}
          startupProbe:
            httpGet: {path: /api/healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /api/healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources: {{ toYaml .Values.forgejo.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.postgresql.existingCASecret }}
            - {name: postgres-ca, mountPath: /etc/golf/postgres, readOnly: true}
            {{- end }}
            # Forgejo's upstream names: the rootless image's data and config paths.
            - {name: data, mountPath: /var/lib/gitea}
            - {name: config, mountPath: /etc/gitea}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- if .Values.postgresql.existingCASecret }}
        - name: postgres-ca
          secret:
            secretName: {{ .Values.postgresql.existingCASecret | quote }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
  volumeClaimTemplates:
    {{- range $name, $size := dict "data" .Values.forgejo.persistence.dataSize "config" .Values.forgejo.persistence.configSize }}
    - metadata:
        name: {{ $name }}
        annotations: {helm.sh/resource-policy: keep}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $.Values.forgejo.persistence.storageClass }}
        storageClassName: {{ $.Values.forgejo.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ $size | quote }}}
    {{- end }}
{{- end }}
