{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "golf.fullname" . }}
  labels:
    {{- include "golf.labels" . | nindent 4 }}
    app.kubernetes.io/component: golf
spec:
  podSelector:
    matchLabels:
      {{- include "golf.selector" . | nindent 6 }}
      app.kubernetes.io/component: golf
  policyTypes: [Ingress, Egress]
  {{- if or .Values.networkPolicy.ingressFrom (and .Values.observability.metrics.enabled .Values.observability.metrics.ingressFrom) }}
  ingress:
    {{- if .Values.networkPolicy.ingressFrom }}
    - from: {{ toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports: [{protocol: TCP, port: 8080}]
    {{- end }}
    {{- if and .Values.observability.metrics.enabled .Values.observability.metrics.ingressFrom }}
    - from: {{ toYaml .Values.observability.metrics.ingressFrom | nindent 8 }}
      ports: [{protocol: TCP, port: 9090}]
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- include "golf.dnsEgress" . | nindent 4 }}
    {{- if .Values.gitea.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "golf.selector" . | nindent 14 }}
              app.kubernetes.io/component: gitea
      ports: [{protocol: TCP, port: 3000}]
    {{- end }}
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "golf.selector" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports: [{protocol: TCP, port: 5432}]
    {{- end }}
    {{- with .Values.networkPolicy.externalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.gitea.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "golf.fullname" . }}-gitea
  labels:
    {{- include "golf.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  podSelector:
    matchLabels:
      {{- include "golf.selector" . | nindent 6 }}
      app.kubernetes.io/component: gitea
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "golf.selector" . | nindent 14 }}
              app.kubernetes.io/component: golf
        {{- if .Values.webhooks.enabled }}
        - podSelector:
            matchLabels:
              {{- include "golf.selector" . | nindent 14 }}
              app.kubernetes.io/component: webhooks
        {{- end }}
      ports: [{protocol: TCP, port: 3000}]
    {{- with .Values.networkPolicy.giteaIngressFrom }}
    - from: {{ toYaml . | nindent 8 }}
      ports: [{protocol: TCP, port: 3000}]
    {{- end }}
    {{- with .Values.networkPolicy.ingressFrom }}
    - from: {{ toYaml . | nindent 8 }}
      ports: [{protocol: TCP, port: 3000}, {protocol: TCP, port: 2222}]
    {{- end }}
  egress:
    {{- include "golf.dnsEgress" . | nindent 4 }}
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "golf.selector" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports: [{protocol: TCP, port: 5432}]
    {{- end }}
    {{- with .Values.networkPolicy.externalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "golf.fullname" . }}-postgres
  labels:
    {{- include "golf.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      {{- include "golf.selector" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "golf.selector" . | nindent 14 }}
              app.kubernetes.io/component: golf
        {{- if .Values.webhooks.enabled }}
        - podSelector:
            matchLabels:
              {{- include "golf.selector" . | nindent 14 }}
              app.kubernetes.io/component: webhooks
        {{- end }}
        {{- if .Values.gitea.enabled }}
        - podSelector:
            matchLabels:
              {{- include "golf.selector" . | nindent 14 }}
              app.kubernetes.io/component: gitea
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
    {{- with .Values.networkPolicy.postgresIngressFrom }}
    - from: {{ toYaml . | nindent 8 }}
      ports: [{protocol: TCP, port: 5432}]
    {{- end }}
  egress: []
{{- end }}
{{- if .Values.webhooks.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "golf.fullname" . }}-webhooks
  labels:
    {{- include "golf.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhooks
spec:
  podSelector:
    matchLabels:
      {{- include "golf.selector" . | nindent 6 }}
      app.kubernetes.io/component: webhooks
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- include "golf.dnsEgress" . | nindent 4 }}
    {{- if .Values.gitea.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "golf.selector" . | nindent 14 }}
              app.kubernetes.io/component: gitea
      ports: [{protocol: TCP, port: 3000}]
    {{- end }}
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "golf.selector" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports: [{protocol: TCP, port: 5432}]
    {{- end }}
    {{- with .Values.networkPolicy.externalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.webhooks.httpsEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
