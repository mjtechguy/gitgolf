{{- $prefix := ternary "FORGEJO" "GITEA" (eq .Values.forge.kind "forgejo") -}}
{{- if .Values.gitea.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "golf.fullname" . }}-gitea
  labels:
    {{- include "golf.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  clusterIP: None
  selector:
    {{- include "golf.selector" . | nindent 4 }}
    app.kubernetes.io/component: gitea
  ports:
    - {name: http, port: 3000, targetPort: http}
    - {name: ssh, port: 2222, targetPort: ssh}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "golf.fullname" . }}-gitea
  labels:
    {{- include "golf.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  serviceName: {{ include "golf.fullname" . }}-gitea
  # One canonical filesystem writer. Do not scale this StatefulSet manually.
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy: {type: RollingUpdate}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels:
      {{- include "golf.selector" . | nindent 6 }}
      app.kubernetes.io/component: gitea
  template:
    metadata:
      labels:
        {{- include "golf.selector" . | nindent 8 }}
        app.kubernetes.io/component: gitea
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gitea
          image: {{ include "golf.image" .Values.gitea.image | quote }}
          imagePullPolicy: {{ .Values.gitea.image.pullPolicy }}
          securityContext:
            {{- include "golf.containerSecurity" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 3000}
            - {name: ssh, containerPort: 2222}
          env:
            - {name: GITEA_APP_INI, value: /etc/gitea/app.ini}
            - {name: {{ $prefix }}__database__DB_TYPE, value: postgres}
            - name: {{ $prefix }}__database__HOST
              value: {{ include "golf.postgresHost" . | quote }}
            - name: {{ $prefix }}__database__NAME
              value: {{ .Values.gitea.database.name | quote }}
            - name: {{ $prefix }}__database__USER
              value: {{ .Values.gitea.database.user | quote }}
            - name: {{ $prefix }}__database__SSL_MODE
              value: {{ ternary "disable" .Values.gitea.database.sslMode .Values.postgresql.enabled | quote }}
            - name: {{ $prefix }}__database__PASSWD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: GITEA_DB_PASSWORD}
            - {name: {{ $prefix }}__server__PUBLIC_URL_DETECTION, value: "never"}
            - name: {{ $prefix }}__server__ROOT_URL
              value: {{ printf "%s/" (trimSuffix "/" .Values.gitea.publicURL) | quote }}
            - name: {{ $prefix }}__server__SSH_DOMAIN
              value: {{ regexReplaceAll ":[0-9]+$" (urlParse .Values.gitea.publicURL).host "" | quote }}
            - name: {{ $prefix }}__server__SSH_PORT
              value: {{ .Values.gitea.sshPort | quote }}
            - {name: {{ $prefix }}__server__SSH_LISTEN_PORT, value: "2222"}
            - {name: {{ $prefix }}__security__INSTALL_LOCK, value: "true"}
            - {name: {{ $prefix }}__service__DISABLE_REGISTRATION, value: "true"}
            - {name: {{ $prefix }}__actions__ENABLED, value: "false"}
            - {name: {{ $prefix }}__actions__WORKFLOW_DIRS, value: {{ .Values.gitea.workflowDirs | quote }}}
          startupProbe:
            httpGet: {path: /api/healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /api/healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources: {{ toYaml .Values.gitea.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/gitea}
            - {name: config, mountPath: /etc/gitea}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
  volumeClaimTemplates:
    {{- range $name, $size := dict "data" .Values.gitea.persistence.dataSize "config" .Values.gitea.persistence.configSize }}
    - metadata:
        name: {{ $name }}
        annotations: {helm.sh/resource-policy: keep}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $.Values.gitea.persistence.storageClass }}
        storageClassName: {{ $.Values.gitea.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ $size | quote }}}
    {{- end }}
{{- end }}
