{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "golf.fullname" . }}
  labels:
    {{- include "golf.labels" . | nindent 4 }}
    app.kubernetes.io/component: golf
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecret | quote }}
      hosts:
        - {{ regexReplaceAll ":[0-9]+$" (urlParse .Values.publicURL).host "" | quote }}
        {{- if .Values.gitea.enabled }}
        - {{ regexReplaceAll ":[0-9]+$" (urlParse .Values.gitea.publicURL).host "" | quote }}
        {{- end }}
  {{- end }}
  rules:
    - host: {{ regexReplaceAll ":[0-9]+$" (urlParse .Values.publicURL).host "" | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "golf.fullname" . }}, port: {name: http}}
    {{- if .Values.gitea.enabled }}
    - host: {{ regexReplaceAll ":[0-9]+$" (urlParse .Values.gitea.publicURL).host "" | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "golf.fullname" . }}-gitea, port: {name: http}}
    {{- end }}
{{- end }}
