{{- $webhooks := .Values.webhooks | default dict -}}
{{- if $webhooks.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "golf.fullname" . }}-webhooks
  labels:
    {{- include "golf.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhooks
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "golf.selector" . | nindent 6 }}
      app.kubernetes.io/component: webhooks
  template:
    metadata:
      labels:
        {{- include "golf.selector" . | nindent 8 }}
        app.kubernetes.io/component: webhooks
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: webhooks
          image: {{ include "golf.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [webhook-worker]
          securityContext:
            {{- include "golf.containerSecurity" . | nindent 12 }}
          env:
            - name: GOLF_PUBLIC_URL
              value: {{ trimSuffix "/" .Values.publicURL | quote }}
            - name: GOLF_ALLOW_INSECURE_COOKIES
              value: {{ .Values.allowInsecureCookies | quote }}
            - {name: GOLF_FORGE_KIND, value: {{ .Values.forge.kind | quote }}}
            - {name: GOLF_FORGE_INSTANCE_ID, value: {{ .Values.forge.instanceID | quote }}}
            - {name: GOLF_FORGE_WORKFLOW_DIRS, value: {{ .Values.forgejo.workflowDirs | quote }}}
            - name: GOLF_FORGE_URL
              value: {{ include "golf.forgejoURL" . | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: DATABASE_URL}
            {{- range $key := list "GOLF_ENCRYPTION_KEY" "GOLF_ENCRYPTION_KEYS" "GOLF_ACTIVE_ENCRYPTION_KEY" "GOLF_WEBHOOK_EGRESS_POLICY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: {name: {{ $.Values.existingSecret | quote }}, key: {{ $key }}, optional: true}
            {{- end }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
{{- end }}
