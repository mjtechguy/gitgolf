# Optional local monitoring. See deploy/observability/README.md before starting.
services:
  golf:
    environment:
      GOLF_METRICS_ADDR: :9090
      GOLF_METRICS_TOKEN: ${GOLF_METRICS_TOKEN:?Run deploy/observability/init.py first}
      GOLF_OTLP_HTTP_ENDPOINT: http://jaeger:4318
      GOLF_OTLP_INSECURE: "true"
      GOLF_TRACE_SAMPLE_RATIO: "1"

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    environment:
      # Suppress Jaeger's own query traces; only Golf exports to this collector.
      OTEL_TRACES_SAMPLER: always_off
    command: [--config, /etc/jaeger/config.yaml]
    ports: ["127.0.0.1:16687:16686"]
    volumes:
      - ./deploy/observability/jaeger.yaml:/etc/jaeger/config.yaml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
      - --web.listen-address=0.0.0.0:9090
    ports: ["127.0.0.1:9097:9090"]
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets: [golf_metrics_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_SECURITY_ADMIN_USER: golf
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports: ["127.0.0.1:3037:3000"]
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets: [grafana_admin_password]
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

secrets:
  golf_metrics_token:
    file: ${GOLF_METRICS_TOKEN_FILE:?Run deploy/observability/init.py first}
  grafana_admin_password:
    file: ${GOLF_GRAFANA_PASSWORD_FILE:?Run deploy/observability/init.py first}

volumes:
  prometheus-data:
  grafana-data:
