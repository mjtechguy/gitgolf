name: Typed literal composite
inputs: {value: {required: true}}
runs:
  using: composite
  steps:
    - id: literal
      shell: sh
      run: |
        dollar='$'
        expected="literal <>& 世界 ${dollar}{{ inputs.flag }} ${dollar}(touch /tmp/should-not-exist)"
        test "$INPUT_VALUE" = "$expected"
        test ! -e /tmp/should-not-exist
        echo 'typed-composite-nonrecursive-verified'
