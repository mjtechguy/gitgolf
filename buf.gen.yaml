version: v2
plugins:
  - local: bin/tools/protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: bin/tools/protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
inputs:
  - directory: api
